<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HDFC Securities - Equity Portfolios and Basket Investing Deep Link Generator</title>

<style>
/* ================= THEME TOKENS ================= */
:root {
  --HDFC-blue: #0a3d62;
  --HDFC-blue-soft: #e8f1f8;
  --accent: #2563eb;

  --bg: #f6f9fc;
  --card: #ffffff;
  --border: #dbe4ee;
  --text: #0f172a;

  --success: #15803d;
  --error: #b91c1c;

  --toast-bg: #0f172a;
  --toast-text: #ffffff;

  transition:
    background-color 0.4s ease,
    color 0.4s ease;
}

/* ================= DARK THEME ================= */
[data-theme="dark"] {
  --bg: #020617;
  --card: #020617;
  --border: #1e293b;
  --text: #e5e7eb;

  --toast-bg: #e5e7eb;
  --toast-text: #020617;
}

/* ================= GLOBAL ================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 36px 16px;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Arial;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 960px;
  margin: auto;
}

/* ================= HEADER ================= */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 36px;
}

h1 {
  margin: 0;
  color: var(--HDFC-blue);
}

.theme-toggle {
  border: 1px solid var(--border);
  background: var(--card);
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  transition: background-color 0.4s ease, color 0.4s ease;
}

/* ================= CARD ================= */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 32px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.06);
  transition:
    background-color 0.4s ease,
    border-color 0.4s ease,
    color 0.4s ease;
}

h2 {
  margin-top: 0;
  color: var(--HDFC-blue);
}

/* ================= FORM ================= */
label {
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 999px;
  display: none;
}

.badge.valid {
  background: #dcfce7;
  color: #166534;
}

.badge.invalid {
  background: #fee2e2;
  color: #991b1b;
}

input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-top: 8px;
  margin-bottom: 6px;
  background: transparent;
  color: var(--text);
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background-color 0.4s ease,
    color 0.4s ease;
}

input.error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(185,28,28,0.2);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.error-text {
  font-size: 13px;
  color: var(--error);
  display: none;
}

/* ================= ACTIONS ================= */
.actions {
  display: flex;
  gap: 12px;
  margin: 12px 0;
  flex-wrap: wrap;
}

button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition:
    background-color 0.2s ease,
    transform 0.05s ease;
}

button.primary {
  background: var(--HDFC-blue);
  color: #fff;
}

button.primary:hover {
  background: #062f4b;
}

button.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}

button:active {
  transform: translateY(1px);
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--toast-bg);
  color: var(--toast-text);
  padding: 14px 18px;
  border-radius: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}
</style>

<script>
/* ================= THEME ================= */
const root = document.documentElement;
root.dataset.theme = localStorage.theme || "light";

function toggleTheme() {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  localStorage.theme = root.dataset.theme;
  showToast(`Switched to ${root.dataset.theme} mode`);
}

/* ================= TOAST ================= */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ================= UTILS ================= */
function base64Encode(input) {
  return btoa(input).replace(/=+$/, "");
}

function copyToClipboard(id) {
  const el = document.getElementById(id);
  if (!el.value) return;
  navigator.clipboard.writeText(el.value);
  showToast("Copied to clipboard");
}

function validate(input, domain, badge, err) {
  const v = input.value.trim();
  badge.style.display = "inline-block";

  if (v.startsWith(domain)) {
    badge.className = "badge valid";
    badge.textContent = "Valid";
    input.classList.remove("error");
    err.style.display = "none";
    return true;
  }

  badge.className = "badge invalid";
  badge.textContent = "Invalid";
  input.classList.add("error");
  err.style.display = "block";
  return false;
}

/* ================= EQ ================= */
function generateEQ() {
  const i = eqInput, o = eqOutput;
  if (!validate(i, "https://basketinvesting.hdfcsec.com", eqBadge, eqErr)) {
    showToast("Invalid EQ URL");
    return;
  }

  try {
    const [b, p] = i.value.split("?");
    const u = new URL(b);
    const path = u.pathname + u.hash;

    o.value =
      `https://www.hdfcsec.com/invest-right-2022?key=sso&sso_key=IR_SMALLCASE` +
      `&extra_params=${encodeURIComponent(
        `path=${encodeURIComponent(path)}&params=${encodeURIComponent(p || "")}`
      )}`;

    showToast("EQ deep link generated");
  } catch {
    o.value = "⚠️ Error generating link";
    showToast("Error generating link");
  }
}

/* ================= MTF ================= */
function generateMTF() {
  const i = mtfInput, o = mtfOutput;
  if (!validate(i, "https://mtfbaskets.hdfcsec.com", mtfBadge, mtfErr)) {
    showToast("Invalid MTF URL");
    return;
  }

  try {
    const [b, p] = i.value.split("?");
    const u = new URL(b);
    const path = u.pathname + u.hash;

    o.value =
      ` https://www.hdfcsec.com/invest-right-2022?key=sso&sso_key=IR_MTF_BASKET_SMALLCASE` +
      `&extra_params=${encodeURIComponent(
        `path=${encodeURIComponent(path)}&params=${encodeURIComponent(p || "")}`
      )}`;

    showToast("MTF deep link generated");
  } catch {
    o.value = "⚠️ Error generating link";
    showToast("Error generating link");
  }
}

/* ================= HDFC SKY ================= */
function generateSky() {
  const i = skyInput, o = skyOutput;
  if (!validate(i, "https://invest.hdfcsky.com", skyBadge, skyErr)) {
    showToast("Invalid HDFC Sky URL");
    return;
  }

  try {
    const [b, p] = i.value.split("?");
    const u = new URL(b);
    const path = u.pathname + u.hash;

    o.value =
      `https://hdfcsky.com/sky/hdfc-small-case` +
      `&path=${encodeURIComponent(path)}` +
      `&params=${encodeURIComponent(p || "")}` +
      `&add_params=true`;

    showToast("HDFC Sky deep link generated");
  } catch {
    o.value = "⚠️ Error generating link";
    showToast("Error generating link");
  }
}

/* ================= SHORTCUTS ================= */
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;

  if (mod && e.key === "Enter") {
    e.preventDefault();
    if (document.activeElement.closest("#sky-card")) generateSky();
    else if (document.activeElement.closest("#mtf-card")) generateMTF();
    else generateEQ();
  }

  if (mod && e.shiftKey && e.key.toLowerCase() === "c") {
    e.preventDefault();
    if (document.activeElement.closest("#sky-card")) copyToClipboard("skyOutput");
    else if (document.activeElement.closest("#mtf-card")) copyToClipboard("mtfOutput");
    else copyToClipboard("eqOutput");
  }

  if (mod && e.key.toLowerCase() === "j") {
    e.preventDefault();
    toggleTheme();
  }
});
</script>
</head>

<body>
<div class="container">
  <header>
    <h1>HDFC Securities · Equity Portfolios and Basket Investing Deep Links</h1>
    <div class="theme-toggle" onclick="toggleTheme()">🌓 Theme</div>
  </header>

  <!-- EQ -->
  <div class="card">
    <h2><a href="https://basketinvesting.hdfcsec.com/" target="_blank">IR Equity Portfolios and Basket Investing</a></h2>

    <label>
      HDFC Basket URL
      <span id="eqBadge" class="badge"></span>
    </label>

    <input id="eqInput" oninput="validate(this,'https://smallcases.sbisecurities.in',eqBadge,eqErr)" />
    <div id="eqErr" class="error-text">Invalid Basket URL</div>

    <div class="actions">
      <button class="primary" onclick="generateEQ()">Generate</button>
      <button class="secondary" onclick="copyToClipboard('eqOutput')">Copy</button>
    </div>

    <textarea id="eqOutput" readonly></textarea>
  </div>

  <!-- MTF -->
  <div class="card" id="mtf-card">
    <h2><a href="https://mtfbaskets.hdfcsec.com/" target="_blank">MTF Baskets</a></h2>

    <label>
      HDFC MTF basket URL
      <span id="mtfBadge" class="badge"></span>
    </label>

    <input id="mtfInput" oninput="validate(this,'https://mtfbaskets.sbisecurities.in',mtfBadge,mtfErr)" />
    <div id="mtfErr" class="error-text">Invalid MTF basket URL</div>

    <div class="actions">
      <button class="primary" onclick="generateMTF()">Generate</button>
      <button class="secondary" onclick="copyToClipboard('mtfOutput')">Copy</button>
    </div>

    <textarea id="mtfOutput" readonly></textarea>
  </div>

  <!-- HDFC Sky -->
  <div class="card" id="sky-card">
    <h2><a href="https://invest.hdfcsky.com/" target="_blank">HDFC Sky Equity Portfolios and Basket Investing</a></h2>

    <label>
      HDFC Sky Basket URL
      <span id="skyBadge" class="badge"></span>
    </label>

    <input id="skyInput" oninput="validate(this,'https://google.com',skyBadge,skyErr)" />
    <div id="skyErr" class="error-text">Invalid HDFC Sky Basket URL</div>

    <div class="actions">
      <button class="primary" onclick="generateSky()">Generate</button>
      <button class="secondary" onclick="copyToClipboard('skyOutput')">Copy</button>
    </div>

    <textarea id="skyOutput" readonly></textarea>
  </div>
</div>

<div id="toast" class="toast"></div>
</body>
</html>
